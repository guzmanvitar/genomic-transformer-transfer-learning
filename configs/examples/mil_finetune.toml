# Jaguar Positional MIL Fine-tuning Configuration
#
# This config trains on pre-extracted per-individual embedding shards rather
# than raw DNABERT-2 token windows.

[training]
# Required paths.
embeddings_dir = "artifacts/jaguar_embeddings"
metadata_csv = "data/jaguar/metadata.csv"
output_dir = "models/jaguar_mil"

# MIL architecture.
embedding_dim = 768
hidden_dim = 256
locus_dropout = 0.1
genome_scale = 100000000.0
dropout = 0.1
n_biomes = 5

# Optimization.
mil_steps = 5000
lr_mil = 0.0001
weight_decay = 0.01
cls_loss_weight = 0.1
reg_loss_weight = 1.0
huber_delta = 1.0
gradient_accumulation_steps = 4
mixed_precision = "bf16"
warmup_fraction = 0.1
gradient_clip = 1.0

# Cross-validation.
n_folds = 5
fold_index = 0
seed = 42

# Runtime.
num_workers = 0
log_every = 10
eval_every = 100
eval_max_steps = 50
save_every = 500
tensorboard_subdir = "tensorboard"
patience = 10
