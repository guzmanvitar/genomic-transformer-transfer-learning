# Offline DNABERT-2 embedding extraction configuration for MIL training.
#
# This stage freezes the pretrained backbone and materializes one shard per
# jaguar individual so downstream MIL training never needs to load DNABERT-2.

[extraction]
# ==========================================================================
# REQUIRED FIELDS — No defaults
# ==========================================================================

# Path to the pretrained DNABERT-2 checkpoint (foundation or fine-tuned).
backbone_path = "models/foundation_felid/best/hf_model"

# JSONL of extracted FinetuneWindow records.
windows_jsonl = "data/processed/finetune/windows.jsonl"

# Jaguar metadata CSV keyed by sample_id.
metadata_csv = "data/raw/jaguar_location.csv"

# Output directory for per-individual embedding shards and manifest metadata.
output_dir = "data/processed/finetune/embeddings"

# ==========================================================================
# OPTIONAL FIELDS — All have production defaults
# ==========================================================================

# Pooling strategy for sequence embeddings: "cls" or "mean".
pooling_strategy = "cls"

# Number of windows per frozen-backbone forward pass.
extraction_batch_size = 128

# Device request: "auto", "cpu", or "cuda".
device = "auto"

# On-disk embedding dtype. Only float32 is currently supported.
dtype_str = "float32"
