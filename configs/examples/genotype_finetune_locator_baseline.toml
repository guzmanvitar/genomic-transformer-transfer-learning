# Locator Baseline — faithful reproduction of Battey et al. (2020) defaults
#
# Runs the genotype MLP on raw genotypes (no VES transfer learning) with
# Locator's published hyperparameters: 10 hidden layers, 256 units, 0.25
# dropout, Adam lr=0.001.  Uses the same LOOCV protocol and haversine
# evaluation metrics as the VES-guided experiments for direct comparison.
#
# optuna_n_trials = 0 bypasses hyperparameter search entirely, using the
# fixed values below.  This isolates the transfer learning contribution:
# any performance gap between this baseline and the VES-guided models is
# attributable to the felid foundation model's locus importance signal.

[training]
# Required paths (same as other configs).
vcf_path = "data/raw/jaguar.57samples.allChr.snps.hardFilter.bi.maf.ld.masked.hwe.recode.vcf"
reference_fasta = "data/raw/felid_foundation/reference/DNAZOO_Panthera_onca_HiC.fna.gz"
metadata_csv = "data/raw/jaguar_location.csv"
backbone_path = "models/foundation_felid/best/hf_model"
output_dir = "models/jaguar_locator_baseline"

# Genotype matrix caching (shared with other runs).
genotype_cache_dir = "data/processed/genotype_matrix"

# No VES — raw genotypes only.
compute_ves = false
ves_mode = "none"

# Coordinate regression only (Locator has no classifier head).
cls_loss_weight = 0.0

# Fixed hyperparameters — no Optuna search.
optuna_n_trials = 0

# Locator defaults (Battey et al., 2020).
n_hidden_layers = 10
hidden_dim = 256
dropout = 0.25
learning_rate = 0.001
weight_decay = 0.0
max_epochs = 5000
coord_loss_weight = 1.0

# Cross-validation.
cv_strategy = "loocv"
n_folds = 5
seed = 42

optuna_study_name = "jaguar_locator_baseline"

# Runtime.
device = "auto"
tensorboard_subdir = "tensorboard"
