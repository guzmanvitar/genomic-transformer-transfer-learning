# DNABERT-2 Jaguar Multi-Task Fine-tuning Configuration
#
# Two-phase training:
#   Phase 1 (heads-only warm-up): backbone frozen, only task heads trained.
#   Phase 2 (joint training): last N transformer blocks + task heads trained
#   with differential learning rates.
#
# Best checkpoint selected by median Haversine distance (lower is better)
# with macro F1 as tie-breaker.

[training]
# ============================================================================
# REQUIRED FIELDS — No defaults
# ============================================================================

# Path to the foundation pre-trained DNABERT-2 model (from Step 3).
backbone_path = "models/foundation_felid/best/hf_model"

# JSONL file of extracted FinetuneWindow records (from Step 5).
windows_jsonl = "data/processed/finetune/windows.jsonl"

# Jaguar metadata CSV with sample_id, latitude, longitude, biome_population_label.
metadata_csv = "data/raw/jaguar_location.csv"

# Output directory for checkpoints and TensorBoard logs.
output_dir = "models/finetune"

# ============================================================================
# OPTIONAL FIELDS — All have production defaults
# ============================================================================

# Cross-validation fold settings.
n_folds = 5
fold_index = 0

# Pooling strategy for sequence representations: "cls" or "mean".
pooling_strategy = "cls"

# Number of biome classes (fixed by the jaguar dataset).
n_biomes = 5

# Phase 1: heads-only warm-up steps.
phase1_steps = 1000

# Phase 2: joint training steps (backbone + heads).
phase2_steps = 3000

# Number of transformer blocks to unfreeze in Phase 2 (2 or 3).
unfreeze_layers = 2

# Learning rates.
lr_heads_phase1 = 1e-4
lr_backbone_phase2 = 1e-5
lr_heads_phase2 = 1e-4

# Multi-task loss weights.
cls_loss_weight = 0.1
reg_loss_weight = 1.0

# Huber loss delta for coordinate regression.
huber_delta = 1.0

# Batch sizes and gradient accumulation.
per_device_train_batch_size = 16
per_device_eval_batch_size = 32
gradient_accumulation_steps = 4

# Warmup fraction of total steps for LR schedule.
warmup_fraction = 0.1

# Gradient norm clipping threshold.
gradient_clip = 1.0

# Random seed.
seed = 42

# DataLoader workers per rank.
num_workers = 0

# AdamW weight decay.
weight_decay = 0.01

# Logging, eval, and checkpoint frequency (in steps).
log_every = 10
eval_every = 100
save_every = 500

# TensorBoard subdirectory under output_dir.
tensorboard_subdir = "tensorboard"

# Dropout rate for task heads.
dropout = 0.1
