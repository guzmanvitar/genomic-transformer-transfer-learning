[experiment]
name = "regression_transfer_bootstrap"
description = "Bootstrap transfer-learning config spanning pretraining, fine-tuning, and evaluation."
requires_private_data = false

[data]
felid_manifest = "manifests/felids/example_manifest.csv"
jaguar_manifest = "manifests/jaguar/example_manifest.csv"
jaguar_metadata_fields = [
  "sample_id",
  "individual_id",
  "locality_id",
  "biome_population_label",
  "latitude",
  "longitude",
]
split_unit = "individual_id"

[tasks.primary]
kind = "coordinate_regression"
target_columns = ["latitude", "longitude"]
primary_metric = "median_geodesic_error_km"
secondary_metrics = ["mean_geodesic_error_km", "r2"]

[tasks.diagnostic]
kind = "biome_population_classification"
label_column = "biome_population_label"
metrics = ["macro_f1", "balanced_accuracy"]

[stages]
order = ["pretrain", "fine_tune", "evaluate", "baseline_evaluate", "report"]

[baseline]
stage = "baseline_evaluate"
provider = "deferred_legacy_group_model"
enabled = false
extension_point = "shared_split_metric_report_contract"
