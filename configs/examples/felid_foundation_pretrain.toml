[pipeline]
name = "felid_foundation_pretrain_contract"
description = "Architecture contract for the six-species felid foundation pretraining corpus."

[paths]
reference_dir = "data/raw/felid_foundation/reference"
processed_dir = "data/processed/felid_foundation_pretrain"
artifact_dir = "artifacts/felid_foundation_pretrain"
report_dir = "reports/generated/felid_foundation_pretrain"

# The full approved six-species roster. Each entry must match an entry in
# APPROVED_FELID_ASSEMBLIES exactly (species + accession). The loader
# derives the assembly_name and species slug from the pinned registry.
[[species]]
species = "Felis catus"
identifier = "GCF_000181335.3"

[[species]]
species = "Panthera tigris"
identifier = "GCF_000464555.1"

[[species]]
species = "Panthera pardus"
identifier = "GCF_001857705.1"

[[species]]
species = "Puma concolor"
identifier = "GCF_003327715.1"

[[species]]
species = "Panthera leo"
identifier = "GCF_018350215.1"

[[species]]
species = "Panthera onca"
identifier = "DNAZOO_Panthera_onca_HiC"

[windowing]
context_window = 512
window_overlap = 128
max_ambiguous_fraction = 0.05
drop_short_sequences = true

[split]
strategy = "global_locus_block"
locus_key_fields = ["contig", "block_id"]
locus_block_size = 50000
assignment_stage = "before_windowing"
evaluation_target = "unseen_loci"
baseline_policy = "reuse_locus_assignments"

[tokenizer]
identifier = "zhihan1996/DNABERT-2-117M"
revision = "7bce263b15377fc15361f52cfab88f8b586abda0"
allowed_alphabet = ["A", "C", "G", "T", "N"]
unsupported_symbol_policy = "reject"
max_position_embeddings = 512
trust_remote_code = true

[export]
format = "parquet"
access_pattern = "offline_window_materialization"
row_group_size = 4096
deterministic_partition_keys = ["split", "contig", "block_id"]
preserve_raw_windows = false
preserve_sequence_hashes = true
preserve_coordinates = true
sequence_hash_algorithm = "sha256"

[runtime]
external_tools = []
