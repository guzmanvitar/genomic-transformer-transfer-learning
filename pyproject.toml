[project]
name = "jaguar-geo-assign"
version = "0.1.0"
description = "Leakage-safe transfer learning scaffold for jaguar geographic assignment."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate>=1.13.0",
    "beartype>=0.22.9",
    "einops>=0.8.2",
    "jaxtyping>=0.3.9",
    "pyarrow>=16,<20",
    "scikit-learn>=1.8.0",
    "tensorboard>=2.20.0",
    "torch>=2.11.0",
    "transformers>=5.6,<6",
]

[project.scripts]
jaguar-geo-assign = "jaguar_geo_assign.cli:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
    "tomli-w>=1.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "UP", "W"]
ignore = [
    "N812",  # lowercase-imported-as-non-lowercase (common in ML: import torch.nn as nn)
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
addopts = "-q -m 'not integration'"
testpaths = ["tests"]
markers = [
    "integration: live external services (NCBI and HuggingFace); off by default",
]
